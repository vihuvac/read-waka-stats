name: CI

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"

  pull_request:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"

  # Manual runs (Actions → CI → Run workflow); not gated by path filters
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -coverprofile=coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          disable_search: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
