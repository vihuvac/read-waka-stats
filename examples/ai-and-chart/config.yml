# AI coding + commit hours + LOC chart focus.
- uses: vihuvac/read-waka-stats@v1.0.0
  with:
    WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
    SHOW_OS: "false"
    SHOW_PROJECTS: "false"
    SHOW_EDITORS: "false"
    SHOW_TIMEZONE: "true"
    SHOW_COMMIT: "true"
    SHOW_LANGUAGE: "true"
    SHOW_LINES_OF_CODE: "true"
    SHOW_LANGUAGE_PER_REPO: "false"
    SHOW_LOC_CHART: "true"
    SHOW_DAYS_OF_WEEK: "true"
    SHOW_PROFILE_VIEWS: "false"
    SHOW_SHORT_INFO: "false"
    SHOW_UPDATED_DATE: "true"
    SHOW_TOTAL_CODE_TIME: "true"
    SHOW_AI_CODE_TIME: "true"
    SHOW_AI_CODING: "true"
    SHOW_LANGUAGE_COUNT: "3"
    SYMBOL_VERSION: "1"
    LOCALE: "en"
